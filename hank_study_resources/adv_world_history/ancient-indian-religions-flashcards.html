<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#14243b"><title>Ancient Asia • Study Flashcards</title><style>
:root{color-scheme:dark;--bg:#0d1929;--panel:#182940;--panel2:#223953;--text:#f2f6fc;--muted:#afc0d2;--gold:#e8b968;--green:#60d4ab;--red:#f1a4aa}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -15%,#274463,#0d1929 60%);font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--text);min-height:100vh}main{max-width:900px;margin:auto;padding:28px 18px 55px}header{text-align:center;margin-bottom:23px}.eyebrow{text-transform:uppercase;letter-spacing:.19em;color:var(--gold);font-size:.77rem;font-weight:700}h1{font-size:clamp(1.9rem,5vw,3rem);margin:9px 0}header p{color:var(--muted);margin:0}.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between;margin:25px 0 12px}.toolbar label{display:flex;align-items:center;gap:9px;color:var(--muted)}select,button{font:inherit}select{background:var(--panel);color:var(--text);border:1px solid #46617f;border-radius:10px;padding:10px;max-width:220px}button{cursor:pointer;border-radius:11px;border:1px solid #50647c;background:var(--panel2);color:var(--text);font-weight:650;padding:11px 17px;transition:background .15s,transform .15s}button:hover{background:#34516e}button:active{transform:scale(.98)}button:focus-visible,select:focus-visible,.flash:focus-visible{outline:3px solid var(--gold);outline-offset:3px}button:disabled{opacity:.4;cursor:not-allowed}.stats{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:.92rem;margin:10px 0}.bar{height:8px;background:#34465b;border-radius:10px;overflow:hidden;margin-bottom:23px}.bar>div{height:100%;width:0;background:var(--green);transition:width .25s}.flash{perspective:1200px;cursor:pointer;min-height:330px;border:0;background:transparent;width:100%;text-align:center;padding:0;display:block}.flash-inner{position:relative;min-height:330px;transition:transform .52s;transform-style:preserve-3d}.flash.flipped .flash-inner{transform:rotateY(180deg)}.face{position:absolute;inset:0;border-radius:22px;background:linear-gradient(140deg,#213951,#17283f);border:1px solid #435d76;box-shadow:0 17px 50px #0005;padding:30px;display:flex;flex-direction:column;align-items:center;justify-content:center;backface-visibility:hidden;-webkit-backface-visibility:hidden}.back{transform:rotateY(180deg);background:linear-gradient(145deg,#244853,#173642)}.category{position:absolute;top:23px;left:25px;text-transform:uppercase;color:var(--gold);font-size:.78rem;letter-spacing:.12em;font-weight:750}.type{color:var(--muted);font-size:.87rem;margin-bottom:20px} .face strong{font-size:clamp(1.35rem,3.5vw,2rem);line-height:1.35;max-width:680px}.hint{position:absolute;bottom:22px;color:var(--muted);font-size:.85rem}.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:11px;margin:19px 0}.actions button{min-width:120px}.known{border-color:#368871;color:#b5f9d8}.review{border-color:#aa6371;color:#ffc9d0}.navigation{display:flex;justify-content:space-between;gap:14px;margin-top:17px}.navigation button{flex:1}.lower{margin-top:28px;border-top:1px solid #364b62;padding-top:22px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px}.muted{color:var(--muted);font-size:.87rem}.empty{text-align:center;padding:45px 25px;background:var(--panel);border-radius:19px}footer{text-align:center;margin-top:33px;color:var(--muted);font-size:.8rem}@media(max-width:550px){.flash,.flash-inner{min-height:380px}.face{padding:20px}.actions button{flex:1;min-width:135px}.toolbar{justify-content:center}.category{top:18px;left:18px}}
</style></head><body><main><header><div class="eyebrow">World History • Ancient Civilizations</div><h1>Ancient Asia Flashcards</h1><p>Study Confucianism, Daoism, Buddhism, Hinduism, and ancient India</p></header><div class="toolbar"><label for="filter">Topic <select id="filter"><option value="All">All Topics</option><option>Confucianism</option><option>Daoism</option><option>Buddhism</option><option>Hinduism</option><option>Ancient India</option></select></label><button id="shuffle">⇄ Shuffle Cards</button></div><div class="stats"><span id="counter">Card 1 of 30</span><span id="progressText">0 known · 0 need practice</span></div><div class="bar" aria-label="Known cards progress"><div id="progress"></div></div><button class="flash" id="flash" aria-label="Flip flashcard"><div class="flash-inner"><div class="face front"><span class="category" id="frontCategory"></span><span class="type">QUESTION</span><strong id="question"></strong><span class="hint">Tap or press Space to reveal answer</span></div><div class="face back"><span class="category" id="backCategory"></span><span class="type">ANSWER</span><strong id="answer"></strong><span class="hint">Tap to see question</span></div></div></button><div class="actions"><button id="needs" class="review">× Needs Practice</button><button id="know" class="known">✓ I Know This</button></div><div class="navigation"><button id="prev">← Previous</button><button id="next">Next →</button></div><div class="lower"><button id="missed">Review Missed Cards</button><button id="all">Show All Cards</button><button id="reset">Reset Progress</button></div><footer>Progress is saved in this browser on this device. No account, internet, or external files required.</footer></main><script>
const CARDS=[
['Confucianism','Who founded Confucianism?','Confucius, a Chinese philosopher around 500 BCE.'],
['Confucianism','What is filial piety?','Respecting and honoring your parents and elders.'],
['Confucianism','What is the main goal of Confucianism?','A peaceful, orderly society built on respect and responsibility.'],
['Confucianism','What are the Five Relationships in Confucianism?','Ruler–subject, father–son, husband–wife, older–younger brother, friend–friend.'],
['Confucianism','What are the Analects?','A collection of the sayings and teachings of Confucius.'],
['Daoism','Who is traditionally considered the founder of Daoism?','Laozi (Lao Tzu).'],
['Daoism','What does the Dao mean?','The Way, or the natural order of the universe.'],
['Daoism','What do yin and yang represent?','Opposing but complementary forces that work together in balance.'],
['Buddhism','Who founded Buddhism?','Siddhartha Gautama, known as the Buddha.'],
['Buddhism','What does Buddha mean?','The Enlightened One.'],
['Buddhism','What are the Four Noble Truths mainly about?','Suffering, its causes, its ending, and the path to ending it.'],
['Buddhism','What is the Eightfold Path?','Eight Buddhist practices that help end suffering.'],
['Buddhism','What is nirvana?','Liberation from suffering, craving, and the cycle of rebirth.'],
['Buddhism','Where did Buddhism originate?','Ancient India.'],
['Hinduism','Who founded Hinduism?','No single founder; it developed over many centuries in India.'],
['Hinduism','What is karma?','Actions and their consequences.'],
['Hinduism','What is dharma?','Moral duty and righteous conduct.'],
['Hinduism','What is reincarnation?','Being reborn into another life after death.'],
['Hinduism','What is moksha?','Liberation from the cycle of birth, death, and rebirth.'],
['Hinduism','What are the Vedas?','Ancient sacred texts of Hinduism.'],
['Hinduism','What are the Upanishads?','Hindu philosophical teachings about reality, the self, and liberation.'],
['Ancient India','What is the traditional caste system?','A social hierarchy in India linked to birth and inherited status.'],
['Ancient India','Which group is highest in the traditional caste hierarchy?','Brahmins — priests and scholars.'],
['Ancient India','Who were the Kshatriyas?','Warriors and rulers.'],
['Ancient India','Who were the Vaishyas?','Merchants, farmers, and traders.'],
['Ancient India','Who were the Shudras?','Laborers and service workers.'],
['Ancient India','Who was Emperor Ashoka?','A Maurya emperor who promoted Buddhist teachings.'],
['Ancient India','Why was Emperor Ashoka important?','He helped spread Buddhism throughout India and beyond.'],
['Confucianism','Which philosophy emphasizes respect for elders?','Confucianism.'],
['Daoism','Which philosophy emphasizes harmony with nature?','Daoism.']
].map((item,id)=>({id,category:item[0],question:item[1],answer:item[2]}));
const $=id=>document.getElementById(id);let status={};try{status=JSON.parse(localStorage.getItem('ancient-asia-cards-v1')||'{}')}catch(e){};let filter='All',missedOnly=false,order=CARDS.map(c=>c.id),idx=0;const save=()=>{try{localStorage.setItem('ancient-asia-cards-v1',JSON.stringify(status))}catch(e){}};const visible=()=>order.map(i=>CARDS[i]).filter(c=>(filter==='All'||c.category===filter)&&(!missedOnly||status[c.id]==='missed'));function render(){const cards=visible();if(idx>=cards.length)idx=Math.max(0,cards.length-1);const empty=!cards.length;$('flash').style.display=empty?'none':'block';$('know').disabled=$('needs').disabled=$('prev').disabled=$('next').disabled=empty;$('counter').textContent=empty?'No matching cards':`Card ${idx+1} of ${cards.length}`;const known=Object.values(status).filter(v=>v==='known').length,missed=Object.values(status).filter(v=>v==='missed').length;$('progressText').textContent=`${known} known · ${missed} need practice`;$('progress').style.width=(known/CARDS.length*100)+'%';if(empty){$('question').textContent='';$('answer').textContent='';return}const c=cards[idx];$('frontCategory').textContent=$('backCategory').textContent=c.category;$('question').textContent=c.question;$('answer').textContent=c.answer;$('flash').classList.remove('flipped');$('know').textContent=status[c.id]==='known'?'✓ Known':'✓ I Know This';$('needs').textContent=status[c.id]==='missed'?'× Needs Practice':'× Needs Practice'}function advance(n){const count=visible().length;if(count){idx=(idx+n+count)%count;render()}}$('flash').onclick=()=>$('flash').classList.toggle('flipped');$('prev').onclick=()=>advance(-1);$('next').onclick=()=>advance(1);function mark(v){const c=visible()[idx];if(!c)return;status[c.id]=v;save();if(missedOnly&&v==='known'){render()}else{advance(1)}}$('know').onclick=()=>mark('known');$('needs').onclick=()=>mark('missed');$('filter').onchange=e=>{filter=e.target.value;idx=0;render()};$('shuffle').onclick=()=>{for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}idx=0;render()};$('missed').onclick=()=>{missedOnly=true;idx=0;render()};$('all').onclick=()=>{missedOnly=false;filter='All';$('filter').value='All';idx=0;render()};$('reset').onclick=()=>{if(confirm('Clear all saved study progress?')){status={};save();missedOnly=false;filter='All';$('filter').value='All';idx=0;render()}};document.addEventListener('keydown',e=>{if(e.target.tagName==='SELECT'||e.target.tagName==='BUTTON')return;if(e.key==='ArrowRight')advance(1);else if(e.key==='ArrowLeft')advance(-1);else if(e.key===' '){e.preventDefault();$('flash').click()}});render();
</script></body></html>
